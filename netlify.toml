[build]
command = "npm run build"
publish = "dist/"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/assets/*"
  [headers.values]
    cache-control = '''
    public,
    max-age=31536000,
    immutable'''
[[redirects]]
  from = "/ads.txt"
  to = "https://srv.adstxtmanager.com/19390/woordle.nl"
[[redirects]]
  from = "/auth/callback"
  to = "/index.html"
  status = 200
